<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shirnahar Admin App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-burgundy: #8B2C46;
            --accent-gold: #D4AF37;
        }
        body { font-family: 'Lato', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .text-primary { color: var(--primary-burgundy); }
        .bg-primary { background-color: var(--primary-burgundy); }
        
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar { display: none; }
        
        /* Smooth tab transitions */
        .tab-content { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800">

    <!-- Mobile Login Screen -->
    <div id="authOverlay" class="fixed inset-0 z-50 flex flex-col justify-center items-center p-6 bg-white">
        <div class="w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-pink-50 text-primary rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm border border-pink-100">
                <i class="fa-solid fa-store text-4xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-900 font-serif mb-2">Admin Login</h2>
            <p class="text-gray-500 mb-8">Manage your boutique on the go.</p>
            
            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1 tracking-wider">Email</label>
                    <input type="email" id="adminEmail" required class="w-full border border-gray-200 rounded-2xl p-4 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary bg-slate-50" placeholder="admin@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1 tracking-wider">Password</label>
                    <input type="password" id="adminPassword" required class="w-full border border-gray-200 rounded-2xl p-4 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary bg-slate-50" placeholder="••••••••">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-primary text-white py-4 rounded-2xl font-bold hover:bg-red-900 transition shadow-lg shadow-pink-900/20 mt-4 text-lg">
                    Login
                </button>
                <p id="loginError" class="text-red-500 text-xs text-center font-bold hidden mt-4 p-3 bg-red-50 rounded-xl"></p>
            </form>
        </div>
    </div>

    <!-- Main App Container (Hidden until logged in) -->
    <div id="adminApp" class="hidden flex-col h-screen overflow-hidden">
        
        <!-- Mobile Top Header -->
        <header class="bg-white px-5 py-4 shadow-sm z-20 flex justify-between items-center border-b border-slate-100 flex-shrink-0">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-leaf text-accent text-xl"></i>
                <h1 class="text-xl font-bold text-primary font-serif">Shirnahar House</h1>
            </div>
            <button onclick="handleLogout()" class="w-10 h-10 rounded-full bg-slate-50 text-slate-400 hover:text-red-500 flex items-center justify-center transition">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </header>

        <!-- Main Scrollable Content Area (Padding bottom to account for nav bar) -->
        <main class="flex-grow overflow-y-auto pb-24 p-4 md:p-6 lg:p-8 bg-slate-50">
            
            <!-- INVENTORY TAB -->
            <section id="sectionProducts" class="tab-content max-w-4xl mx-auto">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h2 class="text-2xl md:text-3xl font-bold text-gray-900 font-serif">Inventory</h2>
                        <p class="text-xs md:text-sm text-gray-500">Your dresses & sarees</p>
                    </div>
                </div>
                
                <!-- Product List (Cards) -->
                <div id="adminProductList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Loaded via JS -->
                </div>

                <!-- Floating Add Button for Mobile & Desktop -->
                <button onclick="openProductModal()" class="fixed bottom-24 right-5 md:bottom-10 md:right-10 w-14 h-14 md:w-16 md:h-16 bg-primary text-white rounded-full flex items-center justify-center shadow-lg shadow-pink-900/30 text-xl md:text-2xl z-30 hover:scale-105 transition-transform hover:bg-red-900">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </section>

            <!-- ORDERS TAB -->
            <section id="sectionOrders" class="tab-content max-w-4xl mx-auto hidden">
                <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                    <div>
                        <h2 class="text-2xl md:text-3xl font-bold text-gray-900 font-serif">Customer Orders</h2>
                        <p class="text-xs md:text-sm text-gray-500">Manage deliveries, clean up old records</p>
                    </div>
                    
                    <!-- NEW: Order Filter -->
                    <div class="relative w-full md:w-auto">
                        <select id="orderFilter" onchange="filterAdminOrders(this.value)" class="w-full md:w-auto text-xs md:text-sm font-bold text-slate-600 bg-white border border-slate-200 rounded-xl p-3 outline-none shadow-sm cursor-pointer hover:border-primary transition appearance-none pr-10">
                            <option value="All">All Orders</option>
                            <option value="Pending">Pending</option>
                            <option value="Dispatched">Dispatched</option>
                            <option value="Delivered">Delivered</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>
                
                <!-- Orders List (Cards) -->
                <div id="adminOrderList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Loaded via JS -->
                </div>
            </section>
        </main>

        <!-- Mobile Bottom Navigation Bar (Hidden on md screens if we wanted, but keeping for uniform experience right now) -->
        <nav class="bg-white border-t border-slate-100 fixed bottom-0 w-full z-20 px-6 py-3 flex justify-around items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] md:hidden">
            <button onclick="switchAdminTab('products')" id="navProducts" class="flex flex-col items-center gap-1 text-primary w-20 transition">
                <i class="fa-solid fa-boxes-stacked text-xl"></i>
                <span class="text-[10px] font-bold">Inventory</span>
            </button>
            <button onclick="switchAdminTab('orders')" id="navOrders" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 w-20 transition relative">
                <i class="fa-solid fa-clipboard-list text-xl"></i>
                <span class="text-[10px] font-bold">Orders</span>
            </button>
        </nav>

        <!-- Desktop Sidebar/Nav integration could go here later, reusing the bottom nav logic -->
        <div class="hidden md:flex flex-col bg-white border-r border-slate-100 fixed left-0 top-[73px] bottom-0 w-64 z-10 p-6 shadow-sm">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Menu</p>
            <button onclick="switchAdminTab('products')" id="navProductsDesktop" class="flex items-center gap-3 px-4 py-3 bg-pink-50 text-primary rounded-xl transition font-bold mb-2">
                <i class="fa-solid fa-boxes-stacked w-5"></i> Inventory
            </button>
            <button onclick="switchAdminTab('orders')" id="navOrdersDesktop" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl transition font-bold">
                <i class="fa-solid fa-clipboard-list w-5"></i> Orders
            </button>
        </div>
    </div>

    <!-- Add Product Modal (Absolute positioned for guaranteed scrolling) -->
    <div id="productModal" class="fixed inset-0 bg-black/50 z-50 hidden justify-center items-center p-0 md:p-6 opacity-0 transition-opacity duration-300">
        
        <div class="bg-slate-50 w-full h-full md:h-auto md:max-h-[90vh] md:max-w-md md:rounded-3xl relative flex flex-col transform transition-transform translate-y-full data-[open=true]:translate-y-0 duration-300 md:translate-y-10 shadow-2xl overflow-hidden">
            <!-- Fixed Header -->
            <div class="h-[70px] px-5 flex justify-between items-center border-b border-slate-200 bg-white z-20 shadow-sm flex-shrink-0">
                <h3 class="text-xl font-bold text-gray-900 font-serif">Add New Item</h3>
                <button type="button" onclick="closeProductModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center font-bold text-lg hover:bg-slate-200 transition">&times;</button>
            </div>
            
            <!-- Guaranteed Scrollable Area -->
            <div class="overflow-y-auto p-5 flex-grow">
                <form id="productForm" onsubmit="handleSaveProduct(event)" class="space-y-6 pb-4">
                    
                    <!-- Massive Tap Zone for Phone Camera/Gallery -->
                    <div class="relative">
                        <input type="file" id="prodFile" accept="image/*" multiple onchange="previewImages(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div class="bg-pink-50 border-2 border-dashed border-pink-200 rounded-3xl p-8 flex flex-col items-center justify-center text-center hover:bg-pink-100 transition">
                            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-primary shadow-sm mb-3">
                                <i class="fa-solid fa-camera text-2xl"></i>
                            </div>
                            <p class="font-bold text-primary text-sm">Tap to add photos</p>
                            <p class="text-xs text-gray-400 mt-1">Camera or Gallery (Max 4)</p>
                        </div>
                    </div>
                    
                    <!-- Image Previews -->
                    <div id="imagePreviewContainer" class="flex gap-3 overflow-x-auto pb-2 hidden"></div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Product Name</label>
                            <input type="text" id="prodName" required class="w-full border-b-2 border-slate-100 p-2 text-sm font-bold text-slate-800 focus:outline-none focus:border-primary transition bg-transparent" placeholder="e.g. Royal Blue Silk Saree">
                        </div>
                        
                        <div class="flex gap-4">
                            <div class="w-1/2">
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Price (₹)</label>
                                <input type="number" id="prodPrice" required class="w-full border-b-2 border-slate-100 p-2 text-sm font-bold text-slate-800 focus:outline-none focus:border-primary transition bg-transparent" placeholder="0">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Stock</label>
                                <input type="number" id="prodStock" required value="5" class="w-full border-b-2 border-slate-100 p-2 text-sm font-bold text-slate-800 focus:outline-none focus:border-primary transition bg-transparent">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Category</label>
                            <select id="prodCategory" class="w-full border-b-2 border-slate-100 p-2 text-sm font-bold text-slate-800 focus:outline-none focus:border-primary transition bg-transparent cursor-pointer">
                                <option value="Saree">Saree</option>
                                <option value="Dress">Dress</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Description</label>
                            <textarea id="prodDesc" rows="3" required class="w-full border-b-2 border-slate-100 p-2 text-sm font-bold text-slate-800 focus:outline-none focus:border-primary transition bg-transparent resize-none" placeholder="Fabric, work, etc..."></textarea>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Sticky Save Button -->
            <div class="p-4 bg-white border-t border-slate-200 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-20 flex-shrink-0">
                <button type="submit" form="productForm" id="saveProductBtn" class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-lg hover:bg-red-900 transition shadow-lg flex justify-center items-center gap-2">
                    Save & Publish
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Stock Update Bottom Sheet -->
    <div id="stockModal" class="fixed inset-0 z-50 hidden bg-black/60 flex-col justify-end items-center md:justify-center p-0 md:p-6">
        <div class="bg-white w-full md:max-w-sm rounded-t-3xl md:rounded-3xl p-6 pb-10 transform transition-transform translate-y-0">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900 font-serif">Quick Stock Update</h3>
                <button onclick="closeStockModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold hover:bg-slate-200 transition">&times;</button>
            </div>
            
            <p id="stockProductName" class="text-sm text-gray-500 mb-6 font-medium line-clamp-1"></p>
            <input type="hidden" id="stockUpdateId">
            
            <div class="flex items-center justify-center gap-8 mb-8">
                <button onclick="adjustStock(-1)" class="w-14 h-14 rounded-full bg-slate-50 border border-slate-200 text-slate-600 font-bold text-2xl flex items-center justify-center active:bg-slate-200 hover:bg-slate-100 transition">-</button>
                <input type="number" id="newStockInput" class="w-24 bg-transparent text-center text-5xl font-bold text-primary focus:outline-none" min="0">
                <button onclick="adjustStock(1)" class="w-14 h-14 rounded-full bg-slate-50 border border-slate-200 text-slate-600 font-bold text-2xl flex items-center justify-center active:bg-slate-200 hover:bg-slate-100 transition">+</button>
            </div>
            
            <button onclick="confirmStockUpdate()" id="confirmStockBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-slate-800 transition shadow-lg">
                Confirm Update
            </button>
        </div>
    </div>

    <!-- Minimal Mobile Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-900/95 text-white px-5 py-3 rounded-full shadow-2xl hidden z-[100] text-xs font-bold flex items-center gap-2 backdrop-blur-sm whitespace-nowrap">
        <i class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toastMsg"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        // Added getDoc for restoring stock
        import { getFirestore, collection, addDoc, getDocs, getDoc, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyB5P5YqgXmQQSMNNqX19qr8StQiwDR3HSo",
            authDomain: "shirnahar-house.firebaseapp.com",
            projectId: "shirnahar-house",
            storageBucket: "shirnahar-house.firebasestorage.app",
            messagingSenderId: "289287900697",
            appId: "1:289287900697:web:0ae67720fd7c30efb02488"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let adminProducts = [];
        let adminOrdersData = []; // NEW: Store orders globally for filtering

        // Auth Flow
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('adminApp').classList.remove('hidden');
                document.getElementById('adminApp').classList.add('flex');
                
                // Adjust desktop padding to make room for side nav if logged in
                if(window.innerWidth >= 768) {
                    document.querySelector('main').classList.add('md:ml-64');
                }
                
                loadAdminData(); // Fetch right away when app opens
            } else {
                document.getElementById('authOverlay').classList.remove('hidden');
                document.getElementById('adminApp').classList.add('hidden');
                document.getElementById('adminApp').classList.remove('flex');
            }
        });

        window.handleAdminLogin = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('loginError');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            errBox.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, document.getElementById('adminEmail').value, document.getElementById('adminPassword').value);
            } catch (err) {
                errBox.innerText = "Incorrect details.";
                errBox.classList.remove('hidden');
                btn.innerHTML = "Login";
            }
        };

        window.handleLogout = () => {
            if(confirm("Log out of dashboard?")) signOut(auth);
        };

        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        };

        window.switchAdminTab = (tab) => {
            document.getElementById('sectionProducts').classList.add('hidden');
            document.getElementById('sectionOrders').classList.add('hidden');
            
            // Reset mobile nav colors
            document.getElementById('navProducts').className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 w-20 transition";
            document.getElementById('navOrders').className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 w-20 transition relative";
            
            // Reset desktop nav colors
            const deskProd = document.getElementById('navProductsDesktop');
            const deskOrd = document.getElementById('navOrdersDesktop');
            if(deskProd && deskOrd) {
                deskProd.className = "flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl transition font-bold mb-2";
                deskOrd.className = "flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl transition font-bold";
            }

            if(tab === 'products') {
                document.getElementById('sectionProducts').classList.remove('hidden');
                document.getElementById('navProducts').classList.add('text-primary');
                document.getElementById('navProducts').classList.remove('text-slate-400');
                if(deskProd) deskProd.className = "flex items-center gap-3 px-4 py-3 bg-pink-50 text-primary rounded-xl transition font-bold mb-2";
                loadAdminData();
            } else {
                document.getElementById('sectionOrders').classList.remove('hidden');
                document.getElementById('navOrders').classList.add('text-primary');
                document.getElementById('navOrders').classList.remove('text-slate-400');
                if(deskOrd) deskOrd.className = "flex items-center gap-3 px-4 py-3 bg-pink-50 text-primary rounded-xl transition font-bold";
                loadAdminOrders();
            }
        };

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 1200; // HD photos
                        const scale = Math.min(1, MAX_WIDTH / img.width);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.85)); // Good quality
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        window.previewImages = (e) => {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            if(e.target.files.length > 0) {
                container.classList.remove('hidden');
                const files = Array.from(e.target.files).slice(0, 4); // Max 4 photos
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        container.innerHTML += `
                            <div class="w-20 h-24 rounded-xl overflow-hidden flex-shrink-0 border-2 border-primary shadow-sm">
                                <img src="${e.target.result}" class="w-full h-full object-cover">
                            </div>`;
                    };
                    reader.readAsDataURL(file);
                });
            } else {
                container.classList.add('hidden');
            }
        };

        const loadAdminData = async () => {
            const list = document.getElementById('adminProductList');
            list.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading...</div>`;
            try {
                const q = query(collection(db, "products"), orderBy('createdAt', 'desc'));
                const snap = await getDocs(q);
                adminProducts = [];
                snap.forEach(d => adminProducts.push({ id: d.id, ...d.data() }));
                renderProducts();
            } catch (e) {
                list.innerHTML = `<div class="col-span-full text-center py-10 text-red-400">Error loading data.</div>`;
            }
        };

        const renderProducts = () => {
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';
            if(adminProducts.length === 0) {
                list.innerHTML = `
                    <div class="col-span-full bg-white rounded-3xl p-8 text-center shadow-sm border border-slate-100 mt-4 max-w-md mx-auto w-full">
                        <div class="w-16 h-16 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-box-open text-3xl"></i>
                        </div>
                        <p class="font-bold text-slate-800">Inventory Empty</p>
                        <p class="text-xs text-slate-500 mt-1">Tap + to add dresses.</p>
                    </div>`;
                return;
            }

            adminProducts.forEach(p => {
                const stock = p.stock !== undefined ? p.stock : 0;
                const stockColor = stock > 0 ? "text-green-600 bg-green-50 border-green-200" : "text-red-600 bg-red-50 border-red-200";
                const displayImage = (p.images && p.images.length > 0) ? p.images[0] : (p.imageUrl || 'https://placehold.co/100/8B2C46/FFF');

                list.innerHTML += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex gap-4 relative transition hover:shadow-md">
                        <div class="w-24 h-32 rounded-xl bg-slate-100 overflow-hidden flex-shrink-0 border border-slate-100">
                            <img src="${displayImage}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex flex-col justify-between flex-grow py-1">
                            <div>
                                <span class="text-[9px] font-bold tracking-widest uppercase text-slate-400 mb-1 block">${p.category}</span>
                                <h3 class="font-bold text-slate-800 text-sm md:text-base leading-tight line-clamp-2 mb-1">${p.name}</h3>
                                <p class="font-bold text-primary font-serif md:text-lg">₹${p.price.toLocaleString('en-IN')}</p>
                            </div>
                            
                            <div class="flex justify-between items-end mt-2">
                                <span class="text-[10px] font-bold px-2 py-1 rounded-md border ${stockColor}">${stock} Left</span>
                                <div class="flex gap-2">
                                    <button onclick="openStockModal('${p.id}', ${stock}, '${p.name.replace(/'/g, "\\'")}')" class="w-8 h-8 rounded-full bg-slate-50 text-slate-600 flex items-center justify-center border border-slate-200 hover:bg-primary hover:text-white hover:border-primary transition" title="Update Stock">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="deleteProduct('${p.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center border border-red-100 hover:bg-red-500 hover:text-white transition" title="Delete Item">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        };

        window.openProductModal = () => {
            document.getElementById('productForm').reset();
            document.getElementById('imagePreviewContainer').innerHTML = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            const modal = document.getElementById('productModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Animation triggers
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                const innerModal = modal.querySelector('div.bg-slate-50');
                innerModal.dataset.open = "true";
                if(window.innerWidth >= 768) innerModal.classList.remove('md:translate-y-10');
            }, 10);
        };

        window.closeProductModal = () => {
            const modal = document.getElementById('productModal');
            const innerModal = modal.querySelector('div.bg-slate-50');
            innerModal.dataset.open = "false";
            if(window.innerWidth >= 768) innerModal.classList.add('md:translate-y-10');
            modal.classList.add('opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300); // Wait for transition
        };

        window.handleSaveProduct = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveProductBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            btn.disabled = true;

            try {
                const fileInput = document.getElementById('prodFile');
                let imagesArray = [];
                if(fileInput.files.length > 0) {
                    const filesToProcess = Array.from(fileInput.files).slice(0, 4);
                    for (let file of filesToProcess) {
                        imagesArray.push(await compressImage(file));
                    }
                } else {
                    imagesArray = ["https://placehold.co/400x500/8B2C46/FFFFFF?text=No+Photo"];
                }

                const docRef = await addDoc(collection(db, "products"), {
                    name: document.getElementById('prodName').value.trim(), 
                    price: parseFloat(document.getElementById('prodPrice').value), 
                    stock: parseInt(document.getElementById('prodStock').value), 
                    category: document.getElementById('prodCategory').value, 
                    description: document.getElementById('prodDesc').value.trim(), 
                    images: imagesArray,
                    imageUrl: imagesArray[0],
                    createdAt: Date.now()
                });

                // Optimistically add to local UI instantly without reloading everything
                adminProducts.unshift({
                    id: docRef.id,
                    name: document.getElementById('prodName').value.trim(), 
                    price: parseFloat(document.getElementById('prodPrice').value), 
                    stock: parseInt(document.getElementById('prodStock').value), 
                    category: document.getElementById('prodCategory').value, 
                    description: document.getElementById('prodDesc').value.trim(), 
                    images: imagesArray,
                    imageUrl: imagesArray[0],
                    createdAt: Date.now()
                });

                closeProductModal();
                renderProducts(); // Re-render instantly
                showToast("Product saved!");
            } catch (err) {
                alert("Error saving. Try again.");
            } finally {
                btn.innerHTML = "Save & Publish";
                btn.disabled = false;
            }
        };

        window.openStockModal = (id, currentStock, name) => {
            document.getElementById('stockUpdateId').value = id;
            document.getElementById('stockProductName').innerText = name;
            document.getElementById('newStockInput').value = currentStock;
            document.getElementById('stockModal').classList.remove('hidden');
            document.getElementById('stockModal').classList.add('flex');
        };

        window.closeStockModal = () => {
            document.getElementById('stockModal').classList.add('hidden');
            document.getElementById('stockModal').classList.remove('flex');
        };

        window.adjustStock = (delta) => {
            const input = document.getElementById('newStockInput');
            input.value = Math.max(0, (parseInt(input.value) || 0) + delta);
        };

        window.confirmStockUpdate = async () => {
            const id = document.getElementById('stockUpdateId').value;
            const newStock = parseInt(document.getElementById('newStockInput').value) || 0;
            const btn = document.getElementById('confirmStockBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            
            const pIndex = adminProducts.findIndex(p => p.id === id);
            const oldStock = pIndex !== -1 ? adminProducts[pIndex].stock : 0;
            
            try {
                // Instantly update UI locally
                if(pIndex !== -1) {
                    adminProducts[pIndex].stock = newStock;
                    renderProducts();
                }
                closeStockModal();
                
                await updateDoc(doc(db, "products", id), { stock: newStock });
                showToast("Stock updated");
            } catch(e) {
                // Revert if database fails
                if(pIndex !== -1) {
                    adminProducts[pIndex].stock = oldStock;
                    renderProducts();
                }
                alert("Failed to update.");
            } finally {
                btn.innerHTML = `Confirm Update`;
            }
        };

        window.deleteProduct = async (id) => {
            if(!confirm("Delete this dress forever?")) return;
            
            // Instantly remove from UI
            const originalData = [...adminProducts];
            adminProducts = adminProducts.filter(p => p.id !== id);
            renderProducts();

            try {
                await deleteDoc(doc(db, "products", id));
                showToast("Item deleted");
            } catch (e) {
                // Revert if database fails
                adminProducts = originalData;
                renderProducts();
                alert("Failed to delete item.");
            }
        };

        // NEW: Fetch all orders and store them globally for easy filtering
        const loadAdminOrders = async () => {
            const list = document.getElementById('adminOrderList');
            list.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading...</div>`;
            try {
                const q = query(collection(db, "orders"), orderBy('createdAt', 'desc'));
                const snap = await getDocs(q);
                
                adminOrdersData = [];
                snap.forEach(d => adminOrdersData.push({ id: d.id, ...d.data() }));
                
                // Render based on current filter selection
                const filterStatus = document.getElementById('orderFilter').value;
                renderAdminOrders(filterStatus);
                
            } catch (e) {
                list.innerHTML = `<div class="col-span-full text-center text-red-500 py-4 text-sm">Error loading orders.</div>`;
            }
        };

        // NEW: Triggered when the dropdown filter is changed
        window.filterAdminOrders = (status) => {
            renderAdminOrders(status);
        };

        // NEW: Render orders specifically based on the filter
        const renderAdminOrders = (filterStatus) => {
            const list = document.getElementById('adminOrderList');
            list.innerHTML = '';
            
            const filteredOrders = filterStatus === 'All' ? adminOrdersData : adminOrdersData.filter(o => o.status === filterStatus);

            if(filteredOrders.length === 0) {
                list.innerHTML = `
                    <div class="col-span-full bg-white rounded-3xl p-8 text-center shadow-sm border border-slate-100 mt-4 max-w-md mx-auto w-full">
                        <div class="w-16 h-16 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-receipt text-3xl"></i>
                        </div>
                        <p class="font-bold text-slate-800">No Orders Found</p>
                        <p class="text-xs text-slate-500 mt-1">There are no ${filterStatus !== 'All' ? filterStatus.toLowerCase() : ''} orders to show.</p>
                    </div>`;
                return;
            }
            
            filteredOrders.forEach(o => {
                const itemsText = o.items.map(i => `<div class="text-xs font-medium text-slate-600 py-0.5 flex justify-between"><span>• ${i.name}</span> <span class="text-slate-400 font-bold">x${i.qty}</span></div>`).join('');
                const date = new Date(o.createdAt).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                
                const statusColors = {
                    'Pending': 'bg-amber-100 text-amber-800 border-amber-200',
                    'Dispatched': 'bg-blue-100 text-blue-800 border-blue-200',
                    'Delivered': 'bg-green-100 text-green-800 border-green-200',
                    'Cancelled': 'bg-red-100 text-red-800 border-red-200'
                };
                const colorClass = statusColors[o.status || 'Pending'];

                // Updated Mobile & Desktop Order Card
                list.innerHTML += `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 relative transition hover:shadow-md">
                        <!-- Header -->
                        <div class="flex justify-between items-start border-b border-slate-100 pb-3 mb-3">
                            <div>
                                <span class="font-mono text-[10px] font-bold text-primary bg-pink-50 px-2 py-0.5 rounded border border-pink-100">#${o.id.substring(0,6)}</span>
                                <p class="text-[10px] text-slate-400 mt-1">${date}</p>
                            </div>
                            
                            <!-- Select Menu with new Cancelled option -->
                            <select onchange="updateOrderStatus('${o.id}', this.value)" class="text-[10px] font-bold px-2 py-1 rounded-md border outline-none cursor-pointer hover:shadow-sm transition text-center ${colorClass}">
                                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''} class="bg-white text-slate-800">Pending</option>
                                <option value="Dispatched" ${o.status === 'Dispatched' ? 'selected' : ''} class="bg-white text-slate-800">Dispatched</option>
                                <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''} class="bg-white text-slate-800">Delivered</option>
                                <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''} class="bg-white text-slate-800">Cancelled</option>
                            </select>
                        </div>
                        
                        <!-- Customer Details -->
                        <div class="mb-3">
                            <h4 class="font-bold text-slate-800 text-sm md:text-base">${o.customerName}</h4>
                            <a href="tel:${o.customerPhone}" class="text-xs text-primary font-bold flex items-center gap-1 my-1.5 hover:underline w-fit"><i class="fa-solid fa-phone"></i> ${o.customerPhone}</a>
                            <p class="text-xs text-slate-500 leading-tight">${o.customerAddress}</p>
                        </div>
                        
                        <!-- Items -->
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-3">
                            ${itemsText}
                        </div>
                        
                        <!-- Footer with NEW Delete Button -->
                        <div class="flex justify-between items-center pt-3 border-t border-slate-100">
                            <div>
                                <span class="text-[10px] text-slate-400 font-bold uppercase block">Total (COD)</span>
                                <span class="font-bold text-slate-900 font-serif text-lg">₹${o.totalAmount.toLocaleString('en-IN')}</span>
                            </div>
                            <button onclick="deleteAdminOrder('${o.id}')" class="text-[10px] md:text-xs font-bold text-red-500 bg-red-50 px-3 py-2 rounded-xl border border-red-100 hover:bg-red-500 hover:text-white transition shadow-sm flex items-center gap-1.5" title="Permanently delete order">
                                <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Delete</span>
                            </button>
                        </div>
                    </div>
                `;
            });
        };

        // NEW: Function to permanently delete an order
        window.deleteAdminOrder = async (orderId) => {
            if(!confirm("Are you sure you want to permanently delete this order? This keeps your dashboard clean but cannot be undone.")) return;
            
            // Instantly remove from UI
            const filterStatus = document.getElementById('orderFilter').value;
            const originalData = [...adminOrdersData];
            adminOrdersData = adminOrdersData.filter(o => o.id !== orderId);
            renderAdminOrders(filterStatus);

            try {
                await deleteDoc(doc(db, "orders", orderId));
                showToast("Order permanently deleted");
            } catch (e) {
                // Revert if database fails
                adminOrdersData = originalData;
                renderAdminOrders(filterStatus);
                alert("Failed to delete order.");
            }
        };

        // MODIFIED: Handle marking an order as cancelled (ask to restore stock)
        window.updateOrderStatus = async (orderId, newStatus) => {
            const orderIndex = adminOrdersData.findIndex(o => o.id === orderId);
            if(orderIndex === -1) return;
            const originalStatus = adminOrdersData[orderIndex].status;

            try {
                if (newStatus === 'Cancelled') {
                    const wantToRestore = confirm("Do you want to automatically restore the inventory stock for this cancelled order?");
                    if (wantToRestore) {
                        const orderData = adminOrdersData[orderIndex];
                        if(orderData && orderData.items) {
                            for (const item of orderData.items) {
                                const prodDoc = doc(db, "products", item.id);
                                const prodSnap = await getDoc(prodDoc);
                                if (prodSnap.exists()) {
                                    const currentStock = prodSnap.data().stock || 0;
                                    await updateDoc(prodDoc, { stock: currentStock + item.qty });
                                }
                            }
                            showToast("Stock restored successfully.");
                        }
                    }
                }
                
                // Instantly update UI locally
                adminOrdersData[orderIndex].status = newStatus;
                const filterStatus = document.getElementById('orderFilter').value;
                renderAdminOrders(filterStatus);

                await updateDoc(doc(db, "orders", orderId), { status: newStatus });
                showToast(`Order marked ${newStatus}`);
            } catch (e) {
                // Revert if database fails
                adminOrdersData[orderIndex].status = originalStatus;
                const filterStatus = document.getElementById('orderFilter').value;
                renderAdminOrders(filterStatus);
                alert("Status update failed");
                console.error(e);
            }
        };
    </script>
</body>
</html>
